<div id="yard-chatbot-wrapper">
    <div class="yai-tooltip" id="yai-tooltip">
        Hey I'm YAI, your Yard's AI. Ask me anything!
    </div>

    <div id="chatbot-window">
        <div id="chatbot-header">
            <span>🤖 YAI - Yard Intelligence</span>
            <button id="chatbot-close">✕</button>
        </div>
        <div id="chatbot-messages">
            <div class="chat-bubble chat-bot">
                Hello! I am YAI. I can analyze inventory, dispatch plans, vehicle sequences, and SAP data. <br><br>
                Try asking: <em>"How many plates are ready for dispatch?"</em> or <em>"Which customers are in the AC bay?"</em>
            </div>
        </div>
        <div id="chatbot-input-area">
            <input type="text" id="chatbot-input" placeholder="Ask YAI about yard inventory..." autocomplete="off">
            <button id="chatbot-send">➔</button>
        </div>
    </div>
    
    <button id="chatbot-toggle-btn" title="Ask YAI">
        <span class="robot-icon">🤖</span>
    </button>
</div>
